name: Distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x64
            os: macos-15-intel
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: tools/fm2k_convert/requirements*.txt
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Download pinned engine release
        run: ./tools/download-engine.ps1 -Platform ${{ matrix.platform }}
      - name: Install and test bundled EOS binaries
        run: |
          ./tools/setup-eos.ps1 -Platform ${{ matrix.platform }}
          . ./tools/engine-platform.ps1
          ./tools/test-eos-runtime.ps1 -Lovec (Get-EngineExecutable build/release-engine/compiler -Compiler) -ShippingDirectory build/release-engine/runtime
      - name: Test external assets with the fused launcher
        run: |
          . ./tools/engine-platform.ps1
          ./tools/test-external-media.ps1 -Lovec (Get-EngineExecutable build/release-engine/compiler -Compiler) -ShippingDirectory build/release-engine/runtime
      - name: Build game and standalone asset builder
        # Secrets are not supplied to pull-request builds.
        # Configuration is compiled into trusted push/manual distributions.
        env:
          EOS_PRODUCT_ID: ${{ github.event_name != 'pull_request' && secrets.EOS_PRODUCT_ID || '' }}
          EOS_SANDBOX_ID: ${{ github.event_name != 'pull_request' && secrets.EOS_SANDBOX_ID || '' }}
          EOS_DEPLOYMENT_ID: ${{ github.event_name != 'pull_request' && secrets.EOS_DEPLOYMENT_ID || '' }}
          EOS_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.EOS_CLIENT_ID || '' }}
          EOS_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.EOS_CLIENT_SECRET || '' }}
        run: |
          if ('${{ github.event_name }}' -ne 'pull_request') {
            ./tools/write-eos-config.ps1
          }
          . ./tools/engine-platform.ps1
          ./tools/dist.ps1 -Lovec (Get-EngineExecutable build/release-engine/compiler -Compiler) -ShippingDirectory build/release-engine/runtime
      - name: Test asset builder and package contents
        run: |
          $python = if ($IsWindows) { 'build/asset-builder-venv/Scripts/python.exe' } else { 'build/asset-builder-venv/bin/python' }
          & $python -m unittest discover -s tests -p test_build_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Asset builder tests failed' }
          & $python -m unittest discover -s tests -p test_extract_original.py
          if ($LASTEXITCODE -ne 0) { throw 'Archive tests failed' }
          & tools/check-distribution.ps1
      # upload-artifact zips without Unix permissions; a tarball keeps them.
      - name: Archive Unix distribution
        if: runner.os != 'Windows'
        run: |
          & tar -czf build/VanguardPrincessM-${{ matrix.platform }}.tar.gz -C dist VanguardPrincessM
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the distribution' }
      - name: Upload distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VanguardPrincessM-${{ matrix.platform }}
          path: ${{ runner.os == 'Windows' && 'dist/VanguardPrincessM/' || format('build/VanguardPrincessM-{0}.tar.gz', matrix.platform) }}
          if-no-files-found: error
      # A version tag publishes the same folder as one archive per platform.
      - name: Archive Windows distribution for release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/VanguardPrincessM -DestinationPath build/VanguardPrincessM-${{ matrix.platform }}.zip
      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: build/VanguardPrincessM-${{ matrix.platform }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
      - name: Upload engine check logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: engine-check-logs-${{ matrix.platform }}
          path: build/engine-check/**/*.log
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      # Tags with a suffix such as v0.1.0-beta are published as pre-releases.
      # Re-running the workflow for a tag replaces the attached archives.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" release/* --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
          fi
